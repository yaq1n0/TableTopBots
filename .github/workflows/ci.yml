name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pyright type-checking
        run: pyright

      - name: Run pytest tests
        run: pytest -v

      - name: Check ruff linting
        run: ruff check core/ api/ tests/

      - name: Check ruff formatting
        run: ruff format --check core/ api/ tests/

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compile for type-checking
        run: npx tsc -b

      - name: Ensure vite builds successfully
        run: npm run build

      - name: Check ESlint linting
        run: npx eslint .

      - name: Check Prettier formattig
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
